{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — NetSentinel AI</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1>NetSentinel AI</h1>
      <p class="sub">AI-Based Intrusion Detection System</p>
      {% if form.errors %}
      <div class="message message-error">Invalid username or password.</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label>Username</label>
          <input type="text" name="username" autofocus required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>
      <div class="auth-footer">No account? <a href="{% url 'register' %}">Register</a></div>
    </div>
  </div>
</body>
</html>
